<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murmur readiness — throwaway prototype</title>
<style>body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--foreground,#292735)}main{max-width:700px;margin:auto}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 8px}p{line-height:1.55;color:var(--muted-foreground,#77727f)}.panel{background:var(--card,#f5f3fa);border:1px solid var(--border,#ddd9e8);padding:20px;border-radius:14px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{font-size:12px;color:var(--muted-foreground,#77727f)}dd{margin:4px 0 0;font-weight:600}button{border:1px solid var(--border,#ddd9e8);padding:9px 12px;margin:4px;background:var(--secondary,#eeeaf6);color:var(--foreground,#393044);border-radius:8px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #9781d8}button[aria-selected=true]{background:#6650a4;color:white}#outcome{font-size:18px;font-weight:650;margin-bottom:8px}#note{min-height:45px}small{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-foreground,#77727f)}</style>
<main><small>Throwaway logic prototype · no real permissions</small><h2>When is Murmur ready?</h2><p>Question: can required setup stay simple while optional Mac permissions and safe recording recovery remain independent? Try the walkthroughs or change the state below.</p>
<section class="panel" aria-live="polite"><div id="outcome"></div><div id="note"></div><dl class="grid" id="facts"></dl></section>
<div id="play"><button data-action="model">Toggle local model</button><button data-action="microphone">Allow microphone</button><button data-action="denied">Deny microphone</button><button data-action="accessibility">Toggle Accessibility</button><button data-action="input">Toggle Input Monitoring</button><button data-action="record">Start / stop recording</button><button data-action="recheck">Recheck permissions</button></div>
<section class="panel"><div role="tablist" aria-label="Guided scenarios"><button role="tab" aria-selected="true" data-scenario="first">First setup</button><button role="tab" aria-selected="false" data-scenario="optional">Optional access</button><button role="tab" aria-selected="false" data-scenario="recording">Recheck while recording</button></div><p id="guide"></p><button id="step"></button></section>
<script>
// Pure, portable decision model; the shell is intentionally disposable.
const initial=()=>({engine:true,model:false,microphone:'not determined',accessibility:false,input:false,recording:false,last:'No permission requested.'});
function capability(s){return {canRecord:s.engine&&s.model&&s.microphone==='allowed',canInsert:s.accessibility,canArmBackgroundFn:s.accessibility||s.input};}
function transition(s,a){const n={...s};if(a==='model')n.model=!s.model;if(a==='microphone')n.microphone='allowed';if(a==='denied')n.microphone='denied';if(a==='accessibility')n.accessibility=!s.accessibility;if(a==='input')n.input=!s.input;if(a==='record')n.recording=s.recording?false:capability(s).canRecord;n.last=a==='recheck'?(s.recording?'Read status; defer listener rebuild until idle.':'Read status; safely reconcile shortcut if needed.'):'State changed only in this prototype.';return n;}
const scenarios={first:{text:'Download a model, then explicitly allow the microphone. No optional grants are needed to dictate here.',actions:['model','microphone']},optional:{text:'A prepared app can dictate with both optional permissions absent. Accessibility can add insertion and a background Fn path.',actions:['model','microphone','accessibility']},recording:{text:'A permission recheck during recording must leave the microphone/session running and defer listener replacement.',actions:['model','microphone','record','recheck']}};
let state=initial(),scenario='first',index=0;
function render(){const c=capability(state);document.querySelector('#outcome').textContent=state.recording?'Listening · session preserved':c.canRecord?'Ready to dictate here':!state.model?'Next: download a local model':state.microphone==='denied'?'Next: open Microphone settings':'Next: allow the microphone';document.querySelector('#note').textContent=state.last;document.querySelector('#facts').innerHTML=Object.entries({'Local engine':state.engine?'Ready':'Missing','Local model':state.model?'Ready':'Missing','Microphone':state.microphone,'Accessibility':state.accessibility?'Allowed':'Optional, not allowed','Input Monitoring':state.input?'Allowed':'Optional, not allowed','Background Fn authorization':c.canArmBackgroundFn?'Available; listener must arm':'Optional, focused fallback','Typing in other apps':c.canInsert?'Available':'Optional, use Copy','Recording':state.recording?'Active':'Idle'}).map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+v+'</dd></div>').join('');document.querySelector('#guide').textContent=scenarios[scenario].text;const a=scenarios[scenario].actions[index];document.querySelector('#step').textContent=a?'Step '+(index+1)+': '+({model:'Download model',microphone:'Allow microphone',accessibility:'Allow Accessibility',record:'Start recording',recheck:'Recheck permissions'}[a]):'Walkthrough complete';document.querySelector('#step').disabled=!a;}
document.querySelector('#play').onclick=e=>{if(e.target.dataset.action){state=transition(state,e.target.dataset.action);render();}};document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{scenario=b.dataset.scenario;index=0;state=initial();document.querySelectorAll('[data-scenario]').forEach(t=>t.setAttribute('aria-selected',t===b));render();});document.querySelector('#step').onclick=()=>{state=transition(state,scenarios[scenario].actions[index++]);render();};render();
</script></main></html>
